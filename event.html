/* Layout: sticky top bar; settings + photo list column beside a large live preview; one column on phones */
:root{
  --ink:#0c1240; --bg:#10175a; --panel:#18217a; --panel-2:#1d2890; --line:#2d3aa6;
  --fg:#eef1ff; --muted:#a9b2ea; --gold:#d8ad6d; --gold-hi:#f0cf92; --gold-ink:#1b2a85;
  --field:#0f1652; --ok:#7fe0a8; --err:#ff9d8a;
  --ui:"Expo Arabic","Segoe UI",Tahoma,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg)}
body{color:var(--fg);font-family:var(--ui);font-size:15px;line-height:1.6;min-height:100vh;
  background:radial-gradient(1200px 600px at 70% -10%,#2a3bc4 0%,transparent 60%),var(--bg);
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--ink)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--ink) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.in{max-width:1400px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top .in{display:flex;align-items:center;gap:12px;padding-block:12px}
.top img{height:36px}
.top h1{margin:0;font-size:19px;font-weight:700;flex:1;min-width:0}
.btn{text-decoration:none;font:inherit;font-weight:600;border-radius:10px;padding:8px 14px;cursor:pointer;border:1px solid var(--line);background:var(--panel-2);color:var(--fg);white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:hover{border-color:#4655cf}
.btn:disabled{opacity:.55;cursor:default}
.btn.gold{background:linear-gradient(180deg,var(--gold-hi),var(--gold));border-color:transparent;color:var(--gold-ink);font-weight:700}
.btn.small{padding:6px 10px;font-size:13.5px}
.btn.big{width:100%;padding:12px;font-size:16px}
main{padding-block:20px 60px}
.grid{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:960px){.grid{grid-template-columns:minmax(0,1fr)}}
.col{display:grid;gap:16px;min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:12px;min-width:0}
.card h2{margin:0;font-size:13px;font-weight:600;color:var(--gold);display:flex;align-items:center;gap:8px}
.card h2::before{content:"";width:7px;height:7px;background:var(--gold);transform:rotate(45deg);flex:none}
label{display:grid;gap:5px;font-weight:500;font-size:14px;min-width:0}
input[type=text],textarea,select{width:100%;font:inherit;font-weight:500;color:var(--fg);background:var(--field);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
textarea{resize:vertical;min-height:60px;line-height:1.6}
input:focus-visible,textarea:focus-visible,select:focus-visible,.btn:focus-visible,.drop:focus-visible,.thumb:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.check{display:flex!important;align-items:center;gap:8px;font-weight:500}
.check input{width:auto;accent-color:var(--gold);margin:0}
.hint{font-size:13px;color:var(--muted);font-weight:300;margin:0}
.row{display:flex;gap:8px;flex-wrap:wrap}
.drop{display:grid;place-items:center;gap:4px;text-align:center;padding:18px;border:1.5px dashed #4655cf;border-radius:14px;background:var(--field);cursor:pointer}
.drop:hover,.drop.over{border-color:var(--gold);background:#141c63}
.drop b{font-size:16px}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.thumb{position:relative;border-radius:10px;overflow:hidden;border:2px solid transparent;cursor:pointer;background:var(--field);aspect-ratio:3/2;padding:0}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb[aria-current=true]{border-color:var(--gold)}
.thumb .x{position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(12,18,64,.85);color:#fff;font-size:15px;line-height:24px;cursor:pointer;padding:0}
.thumb .n{position:absolute;bottom:4px;right:6px;font-size:12px;font-weight:700;background:rgba(12,18,64,.8);border-radius:6px;padding:0 6px}
.stage{background:var(--ink);border:1px solid var(--line);border-radius:16px;padding:12px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 78px)}
@media (max-width:960px){.stage{position:static}}
canvas#cv{display:block;width:100%;height:auto;border-radius:8px;touch-action:none;cursor:grab;background:#0a0f38}
canvas#cv.dragging{cursor:grabbing}
.ctl{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px}
.ctl input[type=range]{flex:1;min-width:140px;accent-color:var(--gold)}
.seg{display:inline-grid;grid-template-columns:1fr 1fr;padding:3px;gap:3px;border-radius:11px;background:var(--field);border:1px solid var(--line)}
.seg button{border:0;border-radius:8px;background:transparent;font:inherit;font-weight:600;color:var(--muted);padding:6px 12px;cursor:pointer;font-size:13.5px}
.seg button[aria-pressed=true]{background:var(--gold);color:var(--gold-ink)}
.empty{display:grid;place-items:center;aspect-ratio:2048/1365;color:var(--muted);text-align:center;border:1.5px dashed var(--line);border-radius:8px;padding:16px}
.status{font-size:13.5px;color:var(--muted);margin:0}
.status.ok{color:var(--ok)} .status.err{color:var(--err)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="in">
    <img id="logo" alt="">
    <h1>صور الفعاليات</h1>
    <a class="btn small" href="admin.html">لوحة التهاني</a>
  </div>
</header>

<main class="in">
  <div class="grid">
    <div class="col">
      <section class="card">
        <h2>نص الفعالية</h2>
        <label for="title">العنوان<input type="text" id="title"></label>
        <label for="sub">السطر الثاني <span class="hint">التاريخ والمكان</span><input type="text" id="sub"></label>
        <label class="check" for="showSp"><input type="checkbox" id="showSp" checked>إظهار الرعاة</label>
        <p class="hint" id="spHint">بدون الرعاة يصبح العنوان في الوسط.</p>
        <div class="row" id="spTools">
          <button type="button" class="btn small" id="spPick">تغيير صورة الرعاة</button>
          <button type="button" class="btn small" id="spReset" hidden>الرعاة الأصليون</button>
          <input type="file" id="spFile" accept="image/*" hidden>
        </div>
      </section>

      <section class="card">
        <h2>الصور</h2>
        <div class="drop" id="drop" tabindex="0" role="button" aria-label="إضافة صور">
          <b>أضف صور الفعالية</b>
          <span class="hint">اختر صورة أو عدة صور، أو اسحبها هنا</span>
        </div>
        <input type="file" id="files" accept="image/*" multiple hidden>
        <div class="thumbs" id="thumbs"></div>
        <p class="hint" id="count"></p>
      </section>

      <section class="card">
        <h2>التنزيل</h2>
        <label for="fmt">الصيغة
          <select id="fmt"><option value="jpg">JPG بجودة عالية (أخف، مناسب للنشر)</option><option value="png">PNG بدون ضغط</option></select>
        </label>
        <button type="button" class="btn gold big" id="dlAll" disabled>تنزيل كل الصور (ZIP)</button>
        <button type="button" class="btn" id="dlOne" disabled>تنزيل الصورة الحالية</button>
        <p class="status" id="status"></p>
      </section>
    </div>

    <section class="stage" aria-label="المعاينة">
      <div class="empty" id="empty">أضف صورة أو أكثر لتظهر هنا داخل التصميم.</div>
      <canvas id="cv" width="1024" height="683" hidden aria-label="معاينة الصورة"></canvas>
      <div class="ctl" id="ctl" hidden>
        <div class="seg" role="group" aria-label="طريقة الملء">
          <button type="button" id="mCover" aria-pressed="true">ملء الإطار</button>
          <button type="button" id="mFit" aria-pressed="false">الصورة كاملة</button>
        </div>
        <button type="button" class="btn small" id="zOut" aria-label="تصغير">−</button>
        <input type="range" id="zoom" min="0.3" max="3" step="0.01" value="1" aria-label="تكبير">
        <button type="button" class="btn small" id="zIn" aria-label="تكبير">+</button>
        <button type="button" class="btn small" id="prev">السابقة</button>
        <button type="button" class="btn small" id="next">التالية</button>
      </div>
      <p class="hint" id="ctlHint" style="margin-top:8px" hidden>اسحب الصورة لتحريكها، واستعمل العجلة أو إصبعين للتكبير. أي فراغ يُملأ بنسخة ضبابية من الصورة نفسها.</p>
    </section>
  </div>

const loadImg = src => new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; });
let BASE, SPONS, SPONS_DEFAULT, photos = [], cur = -1, ready = false;
const cv = $("cv"), ctx = cv.getContext("2d");
$("logo").src = LOGO;

/* ---------- photo geometry ----------
   zoom 1 = the photo covers the whole design. Smaller zoom shows more of the photo,
   and any empty space is filled with a blurred copy of the same photo. */
function geom(p){
  const im = p.img, kc = Math.max(FW/im.width, FH/im.height), k = kc * p.zoom;
  const w = im.width * k, h = im.height * k;
  return { w, h, x:(FW - w)/2 + p.ox*FW, y:(FH - h)/2 + p.oy*FH };
}
function fitZoom(p){ const im=p.img; return Math.min(FW/im.width, FH/im.height) / Math.max(FW/im.width, FH/im.height); }
function clampP(p){
  const zmin = Math.min(1, fitZoom(p)) * 0.85;
  p.zoom = Math.min(3, Math.max(zmin, p.zoom));
  const { w, h } = geom(p);
  const mx = Math.abs(w - FW)/2/FW + 0.25, my = Math.abs(h - FH)/2/FH + 0.25;
  p.ox = Math.min(mx, Math.max(-mx, p.ox)); p.oy = Math.min(my, Math.max(-my, p.oy));
}
// "fill the frame" unless that would cut away more than 35% of the photo (portrait or square-ish photos)
function autoFit(p){
  const loss = 1 - fitZoom(p);
  p.zoom = loss > 0.35 ? fitZoom(p) : 1; p.ox = 0; p.oy = 0;
}
function blurOf(p){
  if (p.blur) return p.blur;
  const im = p.img, tw = 36, th = 24, t = document.createElement("canvas"); t.width = tw; t.height = th;
  const k = Math.max(tw/im.width, th/im.height) * 1.1;
  t.getContext("2d").drawImage(im, (tw - im.width*k)/2, (th - im.height*k)/2, im.width*k, im.height*k);
  let src = t;
  for (const s of [3, 9, 28]) {
    const c = document.createElement("canvas"); c.width = tw*s; c.height = th*s;
    const g = c.getContext("2d"); g.imageSmoothingEnabled = true; g.imageSmoothingQuality = "high";
    g.drawImage(src, 0, 0, c.width, c.height); src = c;
  }
  return (p.blur = src);
}
function covers(p){ const g = geom(p); return g.x <= 0.5 && g.y <= 0.5 && g.x + g.w >= FW - 0.5 && g.y + g.h >= FH - 0.5; }

/* ---------- text ---------- */
const FONT = (w, s) => `${w} ${s}px "Expo Arabic", "Segoe UI", Tahoma, sans-serif`;
function fitFont(c, text, weight, size, maxW, minSize){
  let s = size; c.font = FONT(weight, s);
  while (c.measureText(text).width > maxW && s > minSize) { s -= 0.5; c.font = FONT(weight, s); }
  return s;
}

/* ---------- drawing ---------- */
function draw(c, p, scale){
  c.setTransform(scale, 0, 0, scale, 0, 0);
  c.clearRect(0, 0, FW, FH);
  c.fillStyle = "#1b2a85"; c.fillRect(0, 0, FW, FH);
  if (p) {
    if (!covers(p)) c.drawImage(blurOf(p), 0, 0, FW, FH);
    const g = geom(p); c.drawImage(p.img, g.x, g.y, g.w, g.h);
  }
  if (BASE) c.drawImage(BASE, 0, 0, FW, FH);

  c.direction = "rtl"; c.textBaseline = "alphabetic"; c.fillStyle = "#ffffff";
  const title = S.title.trim(), sub = S.sub.trim();
  if (S.showSp) {
    if (SPONS) drawSponsors(c);
    c.font = FONT(500, 25); c.textAlign = "right"; c.fillText("برعاية:", 686, 1175);
    c.textAlign = "right";
    fitFont(c, title, 700, 50.1, 1040, 30); c.fillText(title, 1743, 1231);
    fitFont(c, sub, 500, 39.25, 1040, 24); c.fillText(sub, 1743, 1294);
  } else {
    c.textAlign = "center";
    const cx = FW / 2;   // centred on the image; max width keeps it clear of the logo
    fitFont(c, title, 700, 50.1, 1420, 30); c.fillText(title, cx, 1231);
    fitFont(c, sub, 500, 39.25, 1420, 24); c.fillText(sub, cx, 1294);
  }
}
function drawSponsors(c){
  if (SPONS === SPONS_DEFAULT) { c.drawImage(SPONS, SP.x, SP.y, SP.w, SP.h); return; }
  // custom sponsors image: white rounded box, image fitted inside
  c.save(); c.beginPath(); c.roundRect(SP.x, SP.y, SP.w, SP.h, 21); c.fillStyle = "#fff"; c.fill(); c.clip();
  const pad = 10, k = Math.min((SP.w - 2*pad)/SPONS.width, (SP.h - 2*pad)/SPONS.height);
  const w = SPONS.width*k, h = SPONS.height*k;
  c.drawImage(SPONS, SP.x + (SP.w - w)/2, SP.y + (SP.h - h)/2, w, h); c.restore();
}

let raf = 0;
function redraw(){ if (raf) return; raf = requestAnimationFrame(() => { raf = 0; if (ready) draw(ctx, photos[cur], cv.width / FW); syncCtl(); }); }
let thumbT = 0;
function refreshThumb(i){
  clearTimeout(thumbT);
  thumbT = setTimeout(() => {
    const p = photos[i]; if (!p) return;
    const t = document.createElement("canvas"); t.width = 300; t.height = 200; draw(t.getContext("2d"), p, 300/FW);
    p.thumb = t.toDataURL("image/jpeg", 0.7); renderThumbs();
  }, 250);
}
function refreshAllThumbs(){ photos.forEach((p, i) => { const t = document.createElement("canvas"); t.width = 300; t.height = 200; draw(t.getContext("2d"), p, 300/FW); p.thumb = t.toDataURL("image/jpeg", 0.7); }); renderThumbs(); }

/* ---------- UI ---------- */
function renderThumbs(){
  const box = $("thumbs"); box.textContent = "";
  photos.forEach((p, i) => {
    const b = document.createElement("button"); b.type = "button"; b.className = "thumb"; b.setAttribute("aria-current", i === cur);
    b.setAttribute("aria-label", "الصورة " + (i + 1));
    const im = document.createElement("img"); im.alt = ""; im.src = p.thumb || p.img.src; b.append(im);
    const n = document.createElement("span"); n.className = "n"; n.textContent = i + 1; b.append(n);
    const x = document.createElement("span"); x.className = "x"; x.textContent = "×"; x.title = "حذف"; x.setAttribute("role","button");
    x.onclick = e => { e.stopPropagation(); removePhoto(i); };
    b.append(x);
    b.onclick = () => select(i);
    box.append(b);
  });
  const has = photos.length > 0;
  $("count").textContent = has ? photos.length + (photos.length === 1 ? " صورة" : " صور") : "";
  $("empty").hidden = has; cv.hidden = !has; $("ctl").hidden = !has; $("ctlHint").hidden = !has;
  $("dlAll").disabled = !has; $("dlOne").disabled = !has;
  $("prev").disabled = cur <= 0; $("next").disabled = cur >= photos.length - 1;
}
function select(i){ cur = i; renderThumbs(); redraw(); }
function removePhoto(i){ photos.splice(i, 1); if (cur >= photos.length) cur = photos.length - 1; renderThumbs(); redraw(); }
function syncCtl(){
  const p = photos[cur]; if (!p) return;
  $("zoom").min = (Math.min(1, fitZoom(p)) * 0.85).toFixed(2); $("zoom").value = p.zoom;
  const isFit = Math.abs(p.zoom - fitZoom(p)) < 0.005 && p.zoom < 1;
  $("mCover").setAttribute("aria-pressed", Math.abs(p.zoom - 1) < 0.005 && !p.ox && !p.oy);
  $("mFit").setAttribute("aria-pressed", isFit);
}
function changed(){ const p = photos[cur]; if (!p) return; clampP(p); redraw(); refreshThumb(cur); }

async function addFiles(list){
  const files = [...list].filter(f => f.type.startsWith("image/"));
  if (!files.length) return;
  setStatus("جارٍ تحميل " + files.length + " صورة…");
  for (const f of files) {
    try {
      const img = await loadImg(URL.createObjectURL(f));
      const p = { name: f.name.replace(/\.[^.]+$/, ""), img, zoom:1, ox:0, oy:0 };
      autoFit(p); photos.push(p);
    } catch(e){}
  }
  if (cur < 0) cur = 0;
  refreshAllThumbs(); redraw(); setStatus("");
}
$("drop").onclick = () => $("files").click();
$("drop").onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); $("files").click(); } };
$("files").onchange = e => { addFiles(e.target.files); e.target.value = ""; };
["dragenter","dragover"].forEach(t => $("drop").addEventListener(t, e => { e.preventDefault(); $("drop").classList.add("over"); }));
["dragleave","drop"].forEach(t => $("drop").addEventListener(t, () => $("drop").classList.remove("over")));
$("drop").addEventListener("drop", e => { e.preventDefault(); addFiles(e.dataTransfer.files); });
document.addEventListener("paste", e => { const fs = [...(e.clipboardData?.files || [])]; if (fs.length) addFiles(fs); });

$("title").value = S.title; $("sub").value = S.sub; $("showSp").checked = S.showSp; $("fmt").value = S.fmt;
$("title").oninput = e => { S.title = e.target.value; save(); redraw(); refreshAllThumbsSoon(); };
$("sub").oninput = e => { S.sub = e.target.value; save(); redraw(); refreshAllThumbsSoon(); };
$("showSp").onchange = e => { S.showSp = e.target.checked; save(); $("spTools").hidden = !S.showSp; redraw(); refreshAllThumbsSoon(); };
$("fmt").onchange = e => { S.fmt = e.target.value; save(); };
$("spTools").hidden = !S.showSp;
let allT = 0; function refreshAllThumbsSoon(){ clearTimeout(allT); allT = setTimeout(refreshAllThumbs, 400); }

$("spPick").onclick = () => $("spFile").click();
$("spFile").onchange = async e => { const f = e.target.files[0]; if (!f) return; SPONS = await loadImg(URL.createObjectURL(f)); $("spReset").hidden = false; redraw(); refreshAllThumbsSoon(); e.target.value = ""; };
$("spReset").onclick = () => { SPONS = SPONS_DEFAULT; $("spReset").hidden = true; redraw(); refreshAllThumbsSoon(); };

$("mCover").onclick = () => { const p = photos[cur]; if (!p) return; p.zoom = 1; p.ox = 0; p.oy = 0; changed(); };
$("mFit").onclick = () => { const p = photos[cur]; if (!p) return; p.zoom = fitZoom(p); p.ox = 0; p.oy = 0; changed(); };
$("zoom").oninput = e => { const p = photos[cur]; if (!p) return; p.zoom = +e.target.value; changed(); };
$("zIn").onclick = () => { const p = photos[cur]; if (!p) return; p.zoom *= 1.1; changed(); };
$("zOut").onclick = () => { const p = photos[cur]; if (!p) return; p.zoom /= 1.1; changed(); };
$("prev").onclick = () => cur > 0 && select(cur - 1);
$("next").onclick = () => cur < photos.length - 1 && select(cur + 1);

// drag with mouse or one finger, pinch with two fingers, wheel to zoom
(() => {
  const pts = new Map(); let drag = null, pinch = null;
  const dist = () => { const [a, b] = [...pts.values()]; return Math.hypot(a.x - b.x, a.y - b.y); };
  cv.addEventListener("pointerdown", e => {
    const p = photos[cur]; if (!p) return;
    pts.set(e.pointerId, { x:e.clientX, y:e.clientY }); try { cv.setPointerCapture(e.pointerId); } catch(_){} cv.classList.add("dragging");
    if (pts.size === 1) drag = { x:e.clientX, y:e.clientY, ox:p.ox, oy:p.oy };
    if (pts.size === 2) { drag = null; pinch = { d:dist(), z:p.zoom }; }
  });
  cv.addEventListener("pointermove", e => {
    if (!pts.has(e.pointerId)) return; const p = photos[cur]; if (!p) return;
    pts.set(e.pointerId, { x:e.clientX, y:e.clientY });
    if (pinch && pts.size >= 2) { p.zoom = pinch.z * dist() / pinch.d; changed(); }
    else if (drag) { const k = FW / cv.clientWidth; p.ox = drag.ox + (e.clientX - drag.x) * k / FW; p.oy = drag.oy + (e.clientY - drag.y) * k / FH; changed(); }
  });
  const end = e => { pts.delete(e.pointerId); pinch = null;
    if (pts.size === 1) { const q = [...pts.values()][0], p = photos[cur]; drag = { x:q.x, y:q.y, ox:p.ox, oy:p.oy }; } else drag = null;
    if (!pts.size) cv.classList.remove("dragging"); };
  cv.addEventListener("pointerup", end); cv.addEventListener("pointercancel", end);
  cv.addEventListener("wheel", e => { const p = photos[cur]; if (!p) return; e.preventDefault(); p.zoom *= e.deltaY < 0 ? 1.05 : 0.95; changed(); }, { passive:false });
})();

/* ---------- export ---------- */
function setStatus(t, k){ const el = $("status"); el.textContent = t; el.className = "status" + (k ? " " + k : ""); }
async function render(p){
  const c = document.createElement("canvas"); c.width = FW; c.height = FH; draw(c.getContext("2d"), p, 1);
  const png = S.fmt === "png";
  return await new Promise(r => c.toBlob(r, png ? "image/png" : "image/jpeg", png ? undefined : 0.95));
}
const safeName = t => (t || "فعالية").replace(/[\\/:*?"<>|]/g, "").trim().slice(0, 60) || "فعالية";
const fileName = i => safeName(S.title) + " - " + String(i + 1).padStart(2, "0") + (S.fmt === "png" ? ".png" : ".jpg");
function saveBlob(blob, name){
  const url = URL.createObjectURL(blob), a = document.createElement("a"); a.href = url; a.download = name;
  document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 8000);
}
$("dlOne").onclick = async () => { const p = photos[cur]; if (!p) return; setStatus("جارٍ التجهيز…"); saveBlob(await render(p), fileName(cur)); setStatus("تم التنزيل.", "ok"); };
$("dlAll").onclick = async () => {
  if (!photos.length) return;
  const b = $("dlAll"); b.disabled = true;
  try {
    if (photos.length === 1 || !window.JSZip) {
      for (let i = 0; i < photos.length; i++) { setStatus("جارٍ تجهيز " + (i + 1) + " من " + photos.length + "…"); saveBlob(await render(photos[i]), fileName(i)); await new Promise(r => setTimeout(r, 400)); }
    } else {
      const zip = new JSZip();
      for (let i = 0; i < photos.length; i++) { setStatus("جارٍ تجهيز " + (i + 1) + " من " + photos.length + "…"); zip.file(fileName(i), await render(photos[i])); }
      setStatus("جارٍ ضغط الملف…");
      saveBlob(await zip.generateAsync({ type:"blob" }), safeName(S.title) + ".zip");
    }
    setStatus("تم تنزيل " + photos.length + (photos.length === 1 ? " صورة." : " صور."), "ok");
  } catch(e) { setStatus("تعذّر التجهيز. جرّب عدداً أقل من الصور.", "err"); }
  b.disabled = false;
};

/* ---------- start ---------- */
(async () => {
  try { [BASE, SPONS] = await Promise.all([loadImg(BASE_SRC), loadImg(SPONS_SRC)]); SPONS_DEFAULT = SPONS; } catch(e){}
  try { await Promise.all([500, 700].map(w => document.fonts.load(`${w} 40px "Expo Arabic"`, "أبج"))); } catch(e){}
  ready = true; renderThumbs(); redraw();
})();
</script>
</body>
